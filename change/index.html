<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Подсчёт сдачи — 3 игрока</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>

<div class="topbar">
  <a class="back" href="../">← На главную</a>
  <span class="row">
    <label>Время на ответ (сек): <input type="number" id="cardTime" value="15" min="5"></label>
    <label>Тренировка (мин): <input type="number" id="totalTime" value="10" min="1"></label>
    <button class="green" id="btnStart">Начать [Space]</button>
  </span>
</div>

<div class="panel row">
  <span id="timer">Осталось: 10:00</span>
  <span class="stat">Всего: <b id="stTotal">0</b></span>
  <span class="stat ok">Правильно: <b id="stOk">0</b></span>
  <span class="stat bad">Неправильно: <b id="stBad">0</b></span>
</div>

<div class="players-grid" id="playersGrid">
  <!-- Игроки генерируются из JS -->
</div>

<div class="row" style="margin-top:14px">
  <button class="green" id="btnCheck">Проверить [Enter]</button>
  <button class="orange" id="btnSkip">Пропустить [S]</button>
</div>

<div class="panel" id="result">Нажмите «Начать», чтобы начать тренировку</div>
<div class="hint">Горячие клавиши: Tab (между полями) · 1-5 (фокус на номинал) · Enter (проверить) · S (пропустить) · Space (старт)</div>

<script src="change.js"></script>
</body>
</html>
