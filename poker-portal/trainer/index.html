<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Поиск выигрышной руки</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>

<div class="topbar">
  <a class="back" href="../">← На главную</a>
  <span class="row">
    <label>Показ карт (сек): <input type="number" id="cardTime" value="5" min="1"></label>
    <label>Тренировка (мин): <input type="number" id="totalTime" value="10" min="1"></label>
    <button class="green" id="btnStart">Начать [Space]</button>
  </span>
</div>

<div class="panel row">
  <span id="timer">Осталось: 10:00</span>
  <span class="stat">Всего: <b id="stTotal">0</b></span>
  <span class="stat ok">Правильно: <b id="stOk">0</b></span>
  <span class="stat bad">Неправильно: <b id="stBad">0</b></span>
</div>

<div class="zone board">
  <h3>СТОЛ</h3>
  <div class="cards" id="board"></div>
</div>

<div class="players">
  <div class="zone player">
    <h3>ИГРОК 1</h3>
    <div class="cards" id="hand1"></div>
    <div class="row" style="margin-top:12px">
      <button class="green answer" id="btn1">ВЫИГРАЛ [1]</button>
    </div>
  </div>

  <div class="draw row">
    <button class="orange answer" id="btn0">НИЧЬЯ [D]</button>
  </div>

  <div class="zone player">
    <h3>ИГРОК 2</h3>
    <div class="cards" id="hand2"></div>
    <div class="row" style="margin-top:12px">
      <button class="green answer" id="btn2">ВЫИГРАЛ [2]</button>
    </div>
  </div>
</div>

<div class="panel" id="result">Нажмите «Начать», чтобы раздать карты</div>
<div class="hint">Горячие клавиши: 1 · 2 · D (ничья) · Space (старт)</div>

<script src="../assets/poker.js"></script>
<script src="trainer.js"></script>
</body>
</html>
